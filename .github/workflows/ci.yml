name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout config v3 workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/config
          ref: main
          path: .ci/config

      - name: Checkout validation workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/validation
          ref: main
          path: .ci/validation

      - name: Checkout DI v5 workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/di
          ref: v5
          path: .ci/di

      - name: Checkout auth workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: componenta/auth
          ref: main
          path: .ci/auth

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Use Componenta source workspaces
        run: |
          composer config repositories.componenta-config '{"type":"path","url":".ci/config","options":{"symlink":false,"versions":{"componenta/config":"3.0.0"}}}'
          composer config repositories.componenta-validation '{"type":"path","url":".ci/validation","options":{"symlink":false,"versions":{"componenta/validation":"2.0.1"}}}'
          composer config repositories.componenta-di '{"type":"path","url":".ci/di","options":{"symlink":false,"versions":{"componenta/di":"5.0.0"}}}'
          composer config repositories.componenta-auth '{"type":"path","url":".ci/auth","options":{"symlink":false,"versions":{"componenta/auth":"2.0.3"}}}'

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        if: matrix.php == '8.4'
        run: composer audit --no-interaction

      - name: Run checks
        run: composer check
